name: Build and push a development version on docker 

on: 
  workflow_dispatch: 
    inputs:
      custom_tag:
        type: string
        description: Docker image tag
        required: true
        default: "latest-develop"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-tags: true
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Build with Gradle
      run: ./gradlew build -x test

  docker-build:
    needs: [ build ]
    runs-on: ubuntu-latest

    steps:
      - name: Create more disk space
        run: sudo rm -rf /usr/share/dotnet && sudo rm -rf /opt/ghc && sudo rm -rf "/usr/local/share/boost" && sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - uses: actions/checkout@v7
      - name: Build and push
        id: docker_build
        uses: mr-smithers-excellent/docker-build-push@v7
        with:
          dockerfile: Dockerfile
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          image: lfoppiano/grobid-quantities
          registry: docker.io
          pushImage: true
          tags: ${{ github.event.inputs.custom_tag}}
      - name: Job summary
        if: always()
        env:
          IMAGE_FULL_NAME: ${{ steps.docker_build.outputs.imageFullName }}
          IMAGE_NAME: ${{ steps.docker_build.outputs.imageName }}
          IMAGE_TAGS: ${{ steps.docker_build.outputs.tags }}
        run: |
          {
            echo "## Docker image"
            echo ""
            echo "| Field    | Value |"
            echo "|----------|-------|"
            echo "| Image    | \`$IMAGE_FULL_NAME\` |"
            echo "| Tags     | \`$IMAGE_TAGS\` |"
            echo "| Registry | \`docker.io\` |"
            echo ""
            echo '```'
            echo "docker pull $IMAGE_FULL_NAME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"