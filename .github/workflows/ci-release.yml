name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: docker
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Build with Gradle
      run: ./gradlew build -x test

    - name: Test with Gradle Jacoco
      run: ./gradlew test jacocoTestReport --no-daemon

    - name: Coveralls GitHub Action
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        format: jacoco
        
        
  docker-build:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Create more disk space
        run: sudo rm -rf /usr/share/dotnet && sudo rm -rf /opt/ghc && sudo rm -rf "/usr/local/share/boost" && sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: Set tags
        id: set_tags
        run: |
          DOCKER_IMAGE=lfoppiano/grobid-quantities
          VERSION=""
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            TAGS="${VERSION}"
          else
            TAGS="latest"
          fi
          echo "TAGS=${TAGS}"
          echo ::set-output name=tags::${TAGS}
      - uses: actions/checkout@v7
      - name: Build and push
        id: docker_build
        uses: mr-smithers-excellent/docker-build-push@v7
        with:
          dockerfile: Dockerfile
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          image: lfoppiano/grobid-quantities
          registry: docker.io
          pushImage: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.set_tags.outputs.tags }}
      - name: Job summary
        if: always()
        env:
          IMAGE_FULL_NAME: ${{ steps.docker_build.outputs.imageFullName }}
          IMAGE_NAME: ${{ steps.docker_build.outputs.imageName }}
          IMAGE_TAGS: ${{ steps.docker_build.outputs.tags }}
        run: |
          {
            echo "## Docker image"
            echo ""
            echo "| Field    | Value |"
            echo "|----------|-------|"
            echo "| Image    | \`$IMAGE_FULL_NAME\` |"
            echo "| Tags     | \`$IMAGE_TAGS\` |"
            echo "| Registry | \`docker.io\` |"
            echo ""
            echo '```'
            echo "docker pull $IMAGE_FULL_NAME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
