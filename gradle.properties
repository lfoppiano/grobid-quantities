version=0.9.0-SNAPSHOT

# Kotlin 2.0.21 K2 compiler workaround: IrConstDeclarationAnnotationTransformer
# recursively visits the IR tree and overflows the default ~512KB-1MB JVM thread
# stack when processing LabellingUtilsTest.kt's nested string concatenation chains
# (7 tests, each with up to 10 literals joined by +, which compiles to deeply
# nested IrCall nodes). Bumping the Kotlin compiler daemon stack to 4MB and heap
# to 2GB gives it comfortable headroom on CI runners (GitHub Actions ubuntu-latest).
# Remove this once Kotlin 2.1+ or a later 2.0.x patch fixes the recursive visitor bug.
kotlin.daemon.jvmargs=-Xmx2g -Xss4m
