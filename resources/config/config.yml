grobidHome: ../grobid-home

corsAllowedOrigins: "*"
corsAllowedMethods: "OPTIONS,GET,PUT,POST,DELETE,HEAD"
corsAllowedHeaders: "X-Requested-With,Content-Type,Accept,Origin"

# Limit the maximum number of requests processed at the same time.
# 0 means one slot per available processor, a negative value removes the limit.
maxParallelRequests: 0

# Requests over the limit above are queued until a slot frees up. These three settings bound the
# queue; a request exceeding either bound is rejected with maxQueuedRequestsRejectStatus.
# Note that none of them bounds how long a request may take once it holds a slot - and neither
# does the connector's idleTimeout below. See issue #159.
maxQueuedRequests: 1024
# 0 means a queued request waits indefinitely for its slot
maxQueuedRequestTimeout: 0 seconds
maxQueuedRequestsRejectStatus: 503

cleanlpModelPath: "resources/cleanlp/models"

models:
  - name: "quantities"
    engine: "wapiti"
#    engine: "delft"
    wapiti:
      # wapiti training parameters, they will be used at training time only
      epsilon: 0.00001
      window: 30
      nbMaxIterations: 2000
    delft:
      # deep learning parameters
      architecture: "BidLSTM_CRF"
      #architecture: "scibert"
      useELMo: false
      embeddings_name: "glove-840B"

  - name: "units"
    engine: "wapiti"
#    engine: "delft"
    wapiti:
      # wapiti training parameters, they will be used at training time only
      epsilon: 0.00001
      window: 30
      nbMaxIterations: 2000
    delft:
      # deep learning parameters
      architecture: "BidLSTM_CRF"
      #architecture: "scibert"
      useELMo: false
      embeddings_name: "glove-840B"

  - name: "values"
    engine: "wapiti"
#    engine: "delft"
    wapiti:
      # wapiti training parameters, they will be used at training time only
      epsilon: 0.00001
      window: 30
      nbMaxIterations: 2000
    delft:
      # deep learning parameters
      architecture: "BidLSTM_CRF"
      #architecture: "scibert"
      useELMo: false
      embeddings_name: "glove-840B"


#views:
#  .mustache:
#    cache: false

server:
  type: custom
  applicationConnectors:
    - type: http
      port: 8060
      idleTimeout: 120 seconds
      acceptQueueSize: 2048

  adminConnectors:
    - type: http
      port: 8061
  registerDefaultExceptionMappers: false
  maxThreads: 2048

logging:
  level: INFO
  appenders:
    - type: console
      threshold: INFO
      timeZone: UTC
#Docker-ignore-log-start      
    - type: file
      threshold: DEBUG
      logFormat: "%-6level [%d{HH:mm:ss.SSS}] [%t] %logger{5} - %X{code} %msg %n"
      currentLogFilename: logs/grobid-quantities.log
      archivedLogFilenamePattern: logs/grobid-quantities-%d{yyyy-MM-dd}-%i.log.gz
      archivedFileCount: 7
      timeZone: UTC
      maxFileSize: 10MB
#Docker-ignore-log-end

